// Gradle init script applied by the AnyAppAgent builder (--init-script). It keeps everything about
// signing and versioning out of the app's own files:
//   - signs release builds with the shared AnyAppAgent key (properties passed as
//     ORG_GRADLE_PROJECT_anyapp* environment variables, never written to disk in the app),
//   - sets versionCode to the build number (-PanyappVersionCode=<n>),
//   - with -PanyappUpdateFeed=<url> (and -PanyappUpdateTestingFeed): the shared app's update feeds
//     as string resources anyapp_update_feed / anyapp_update_testing_feed (AppUpdater reads them),
//   - with -PanyappChangeOwner / -PanyappChangeOthers: "Change this app" (anyapp_change_owner,
//     anyapp_change_others string resources),
//   - skips the release lint check (slow, and not useful for side-loaded apps),
//   - with -PanyappAbiSplits=<abi,abi>: also one APK per ABI next to the full one, so a phone
//     downloads only its own native code (about a third of the full APK),
//   - with -PanyappCompressNativeLibs=true: stores native libraries compressed in the APK
//     (they were stored uncompressed: 28.5 MB instead of 10.3 MB for arm64 alone).
gradle.allprojects { p ->
  p.tasks.configureEach { t ->
    if (t.name.startsWith('lintVital')) t.enabled = false
  }
  p.plugins.withId('com.android.application') {
    def code = p.findProperty('anyappVersionCode')
    def store = p.findProperty('anyappStoreFile')
    p.extensions.getByName('androidComponents').finalizeDsl { android ->
      if (store) {
        def cfg = android.signingConfigs.findByName('anyapp') ?: android.signingConfigs.create('anyapp')
        cfg.storeFile = new File(store.toString())
        cfg.storePassword = p.findProperty('anyappStorePassword')?.toString()
        cfg.keyAlias = p.findProperty('anyappKeyAlias')?.toString()
        cfg.keyPassword = p.findProperty('anyappKeyPassword')?.toString()
        cfg.storeType = 'PKCS12'
        android.buildTypes.getByName('release').signingConfig = cfg
      }
      if (code) android.defaultConfig.versionCode = Integer.parseInt(code.toString())
      def feed = p.findProperty('anyappUpdateFeed')?.toString()?.trim()
      if (feed) {
        android.buildFeatures.resValues = true
        android.defaultConfig.resValue('string', 'anyapp_update_feed', feed)
        android.defaultConfig.resValue('string', 'anyapp_update_testing_feed', p.findProperty('anyappUpdateTestingFeed')?.toString()?.trim() ?: '')
      }
      // "Change this app" (docs/CHANGE-THIS-APP.md): the owner's name for the explanation sheet, and
      // "0" when only the owner's phone shows the row (com.anyapp.updates.ChangeThisApp reads them).
      def changeOwner = p.findProperty('anyappChangeOwner')?.toString()?.trim()
      if (changeOwner) {
        android.buildFeatures.resValues = true
        android.defaultConfig.resValue('string', 'anyapp_change_owner', changeOwner)
      }
      def changeOthers = p.findProperty('anyappChangeOthers')?.toString()?.trim()
      if (changeOthers) {
        android.buildFeatures.resValues = true
        android.defaultConfig.resValue('string', 'anyapp_change_others', changeOthers)
      }
      // The fast lane (docs/FAST-LANE.md): the native fingerprint of this build, so the app accepts
      // only quick updates made for exactly this native code (com.anyapp.updates.Ota).
      def runtime = p.findProperty('anyappRuntime')?.toString()?.trim()
      if (runtime) {
        android.buildFeatures.resValues = true
        android.defaultConfig.resValue('string', 'anyapp_runtime', runtime)
      }
      def splits = p.findProperty('anyappAbiSplits')?.toString()?.trim()
      if (splits) {
        def abis = splits.split(',').collect { it.trim() }.findAll { it }
        android.splits.abi.enable = true
        android.splits.abi.reset()
        android.splits.abi.include(*abis)
        android.splits.abi.universalApk = true
        // With splits on, React Native no longer sets ndk.abiFilters, so the prebuilt libraries of
        // other ABIs (React Native's own, ML Kit's) would land in the full APK: filter them out.
        android.defaultConfig.ndk.abiFilters.clear()
        android.defaultConfig.ndk.abiFilters.addAll(abis)
      }
      if (p.findProperty('anyappCompressNativeLibs')?.toString() == 'true') {
        android.packaging.jniLibs.useLegacyPackaging = true
      }
    }
  }
}

<style id="anyapp-workbench">:where(gx-page,gx-questions) :where(h1){font-family:var(--font-display);font-weight:800;letter-spacing:-.03em}
:where(gx-page,gx-questions) :where(h2,h3){font-family:var(--font-sans);font-weight:600}
.gx-eyebrow{font:500 11px/1.3 var(--font-mono);letter-spacing:.09em;border-color:var(--gx-line);color:var(--gx-muted)}
:where(gx-page,gx-questions) :where(a){color:var(--gx-accent)}
.gx-ribbon{background:var(--gx-control);color:var(--gx-bg)}
.gx-q-badge{background:var(--gx-good);color:var(--gx-bg)}
.gx-q-badge.gx-ask{background:var(--gx-warn);color:var(--gx-bg)}
.gx-ref{color:var(--gx-accent)}
</style>

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.anyappcamera'
version = '1.0.0'

// Camera smarts are off unless app.json lists modules/camera/app.plugin.js, which sets these in
// android/gradle.properties. Off, this module is a few stubs and adds no library to the app.
def flag = { String name -> (findProperty(name) ?: 'false').toString() == 'true' }
def codesOn = flag('anyappCameraCodes')
def textOn = flag('anyappCameraText')
def bundled = flag('anyappCameraBundled')

android {
  namespace "expo.modules.anyappcamera"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  sourceSets {
    main {
      java.srcDirs += [codesOn ? 'src/codes-on/java' : 'src/codes-off/java', textOn ? 'src/text-on/java' : 'src/text-off/java']
    }
  }
  lint {
    abortOnError false
  }
}

dependencies {
  if (codesOn) {
    // Google code scanner: the scanning screen comes with Google Play services (no camera permission, small).
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    if (bundled) {
      // Reading codes from a picture with the model inside the app (no Google Play services needed).
      implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    } else {
      // Reading codes from a picture: the reader comes with Google Play services.
      implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
    }
  }
  if (textOn) {
    if (bundled) {
      // The text model inside the app: works without Google Play services, 5.9 MB more per CPU type.
      implementation 'com.google.mlkit:text-recognition:16.0.1'
    } else {
      // The text model comes with Google Play services (downloaded once, on first use).
      implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    }
  }
  if (codesOn || textOn) {
    implementation 'com.google.android.gms:play-services-base:18.5.0'
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.anyappupdates'
version = '1.0.0'

android {
  namespace "expo.modules.anyappupdates"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lint {
    abortOnError false
  }
}

dependencies {
  // ReactHost, for the quick update loader (AnyappUpdatesPackage).
  implementation 'com.facebook.react:react-android'
}
